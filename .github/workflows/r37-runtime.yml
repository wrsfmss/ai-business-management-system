name: R37 Runtime Acceptance

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  runtime-acceptance:
    name: runtime-acceptance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run R37 runtime tests
        run: npx jest tests/scheduler.test.js tests/runtime.integration.test.js --runInBand

      - name: Run complete test suite
        run: npm test -- --runInBand
