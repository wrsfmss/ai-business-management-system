name: brahma-real-db-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'
  pull_request:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'

permissions:
  contents: read

jobs:
  real-db-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d brahma_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      BRAHMA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/brahma_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brahma/requirements.txt

      - name: Install BRAHMA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r brahma/requirements.txt
          python -m pip install pytest psycopg[binary]

      - name: Verify PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['BRAHMA_DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute('select version()')
                  print(cur.fetchone()[0])
          PY

      - name: Apply BRAHMA database migrations
        run: |
          python - <<'PY'
          import glob
          import os
          import psycopg

          paths = sorted(glob.glob('brahma/migrations/*.sql'))
          if not paths:
              raise SystemExit('No BRAHMA SQL migrations found')
          print('Migrations:', *paths, sep='\n  ')

          with psycopg.connect(os.environ['BRAHMA_DATABASE_URL']) as conn:
              for path in paths:
                  print(f'Applying {path}')
                  with conn.cursor() as cur:
                      cur.execute(open(path, encoding='utf-8').read())
              conn.commit()
          PY

      - name: Run BRAHMA integration tests
        run: python -m pytest -q brahma/tests/integration -m integration
