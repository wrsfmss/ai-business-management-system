name: brahma-real-db-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'
  pull_request:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'

jobs:
  real-db-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brahma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BRAHMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brahma_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install BRAHMA dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r brahma/requirements.txt

      - name: Apply BRAHMA database migrations
        run: |
          for file in brahma/migrations/*.sql; do
            [ -f "$file" ] || continue
            psql "$BRAHMA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run BRAHMA integration tests
        run: python -m pytest -q brahma/tests/integration
