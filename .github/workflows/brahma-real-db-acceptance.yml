name: brahma-real-db-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'

jobs:
  real-db-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brahma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BRAHMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brahma_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BRAHMA test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psycopg[binary] fastapi pydantic

      - name: Apply BRAHMA database migrations
        run: |
          if [ -d brahma/migrations ]; then
            for file in brahma/migrations/*.sql; do
              [ -f "$file" ] || continue
              PGPASSWORD=postgres psql "$BRAHMA_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
            done
          fi

      - name: Run real database acceptance
        run: |
          python -m pytest -q brahma/tests/integration/test_real_db_attention.py
