name: brahma-real-db-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'
  pull_request:
    paths:
      - 'brahma/**'
      - '.github/workflows/brahma-real-db-acceptance.yml'

jobs:
  real-db-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brahma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brahma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BRAHMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brahma_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BRAHMA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r brahma/requirements.txt

      - name: Apply BRAHMA database migrations
        run: |
          python - <<'PY'
          import glob
          import os
          import psycopg

          dsn = os.environ['BRAHMA_DATABASE_URL']
          with psycopg.connect(dsn) as conn:
              for path in sorted(glob.glob('brahma/migrations/*.sql')):
                  print(f'Applying {path}')
                  with conn.cursor() as cur:
                      cur.execute(open(path, encoding='utf-8').read())
              conn.commit()
          PY

      - name: Run BRAHMA integration tests
        run: python -m pytest -q brahma/tests/integration
